name = "zunayed-dev-astro"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-01-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
routes = [
  { pattern = "zunayed.dev/*", zone_name = "zunayed.dev" },
  { pattern = "www.zunayed.dev/*", zone_name = "zunayed.dev" }
]

[assets]
binding = "ASSETS"
directory = "./dist"

[observability]
enabled = true
